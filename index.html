<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الطقس</title>
<meta name="theme-color" content="#1668c7">
<meta name="description" content="طقس دقيق لكل مدن العالم: توقعات، جودة هواء، رادار مطر، أوقات صلاة، بحر، قمر وزراعة">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الطقس">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--s1:#1668c7;--s2:#74bff5;--ink:#fff;--ink2:rgba(255,255,255,.82);--ink3:rgba(255,255,255,.58);--gl:rgba(8,16,34,.28);--ln:rgba(255,255,255,.15);--nav:62px;--f:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--s1);-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:var(--ink);min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,var(--s1),var(--s2)) fixed;padding:env(safe-area-inset-top) 0 calc(var(--nav) + env(safe-area-inset-bottom));overflow-x:hidden;line-height:1.5;text-shadow:0 1px 10px rgba(0,25,60,.22)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:10px 16px 28px}
.pg[hidden],.sheet[hidden]{display:none}
a{color:#fff}
.muted{color:var(--ink2);font-size:14px;padding:10px 2px}
.center{text-align:center}
.big-ic{font-size:46px;margin-bottom:6px}
/* top bar */
.top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.pill{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:var(--gl);border:1px solid var(--ln);font-weight:500;text-align:start;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--gl);border:1px solid var(--ln);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ib.on{background:#ffd76a;color:#3a2a00;text-shadow:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[dir=rtl] svg.fl{transform:scaleX(-1)}
/* hero */
.hero{text-align:center;padding:16px 0 4px}
.hero .where{font-size:15px;color:var(--ink2)}
.hero .big{font-size:clamp(108px,36vw,168px);font-weight:200;line-height:1;direction:ltr;letter-spacing:-.04em;margin-top:2px;text-shadow:0 2px 28px rgba(0,25,60,.25)}
.hero .cond{font-size:23px;font-weight:500;margin-top:2px}
.hero .say{font-size:16px;color:var(--ink2);margin:4px auto 0;max-width:30ch}
.hero .hl{display:flex;justify-content:center;gap:22px;margin-top:12px;font-size:15px;color:var(--ink2)}
.hero .hl b{font-weight:600;color:var(--ink)}
.hero .acts{display:flex;justify-content:center;gap:10px;margin-top:14px}
.chipb{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--gl);border:1px solid var(--ln);font-size:13.5px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:rgba(255,190,60,.4);font-size:12px;margin-inline-start:6px}
/* cards */
.card{background:var(--gl);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-top:12px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.card>h3{font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:12px}
.al{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:12px 14px;margin-top:10px;border:1px solid rgba(255,255,255,.24)}
.al.warn{background:rgba(245,166,35,.4)}
.al.danger{background:rgba(226,60,60,.5)}
.al b{font-size:22px;line-height:1.3}
.al strong{display:block;font-weight:600}
.al p{font-size:13.5px;color:var(--ink)}
.tip{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.tip:first-of-type{border:0;padding-top:0}
.tip i{font-style:normal;font-size:22px;width:30px;text-align:center;flex:none}
.hrs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hrs::-webkit-scrollbar{display:none}
.hr{flex:none;width:58px;text-align:center;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.hr em{font-style:normal;font-size:24px;line-height:1.2}
.hr b{font-size:17px;font-weight:500;color:var(--ink)}
.hr small{font-size:11px;color:#a8e0ff;min-height:15px}
.hr.now{background:rgba(255,255,255,.15);border-radius:16px}
.day{display:grid;grid-template-columns:76px 30px 44px 1fr;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--ln)}
.day:first-of-type{border:0;padding-top:0}
.day em{font-style:normal;font-size:22px;text-align:center}
.day small{font-size:11.5px;color:#a8e0ff}
.rng{display:flex;align-items:center;gap:8px;direction:ltr;font-size:14px}
.rng>span{width:34px;text-align:center}
.bar{position:relative;flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#8fd6ff,#ffd76a,#ff9a5a)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--gl);border:1px solid var(--ln);border-radius:18px;padding:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tile.wide{grid-column:1/-1}
.tile h4{font-size:12.5px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.tile .v{font-size:28px;font-weight:300;line-height:1.15}
.tile p{font-size:12.5px;color:var(--ink2);margin-top:6px}
.tile .v small.u{font-size:.48em;font-weight:400;color:var(--ink2)}
.wa{display:inline-block;font-weight:600;transition:transform .4s}
.arcw svg{width:100%;max-width:260px;display:block;margin:0 auto}
html[dir=rtl] .arcw svg{transform:scaleX(-1)}
.sr{display:flex;justify-content:space-between;font-size:14px;margin-top:4px}
.aqi{display:flex;gap:16px;align-items:center}
.aqn{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:600;flex:none;text-shadow:none}
.aqi h5{font-size:18px;font-weight:600}
.aqi p{font-size:13.5px;color:var(--ink2)}
.pol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.pol div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--ink2)}
.pol b{display:block;font-size:16px;font-weight:500;color:var(--ink)}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.links button{background:var(--gl);border:1px solid var(--ln);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.links span{font-size:26px}
.foot{text-align:center;font-size:12px;color:var(--ink3);margin-top:18px}
.upd{background:none;border:0;font-size:12.5px;color:var(--ink3);margin-top:10px}
/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;border:0;background:#fff;color:#12263f;font-weight:600;font-size:15px;text-shadow:none}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.block{display:flex;width:100%;margin-top:12px}
h2.ph{font-size:27px;font-weight:600;margin:12px 0 2px}
.sub{color:var(--ink2);font-size:14px;margin-bottom:8px}
.sh{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.sh h2{font-size:25px;font-weight:600}
.load{padding:80px 0;text-align:center;color:var(--ink2)}
.dots i{display:inline-block;width:9px;height:9px;margin:0 3px 10px;border-radius:50%;background:#fff;animation:pl 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pl{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(8,16,34,.55);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-top:1px solid var(--ln)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--ink3);font-size:11.5px;padding:6px 0;border-radius:14px;min-height:50px;text-shadow:none}
.nav button.on{color:#fff;background:rgba(255,255,255,.14)}
.nav svg.i{width:22px;height:22px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,10,24,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px}
.sbar{display:flex;gap:10px;align-items:center}
.sbar input{flex:1;min-width:0;padding:13px 16px;border-radius:16px;border:1px solid var(--ln);background:rgba(255,255,255,.1);font-size:16px;outline:none}
.sbar input:focus{border-color:#fff}
.sbar button{background:none;border:0;padding:8px}
#sres{flex:1;overflow-y:auto;margin-top:10px;padding-bottom:30px}
#sres h5{font-size:13px;font-weight:500;color:var(--ink2);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--ln);font-size:14px}
.res{display:flex;gap:12px;align-items:center;width:100%;padding:13px 4px;background:none;border:0;border-bottom:1px solid var(--ln);text-align:start}
.res .fl{font-size:26px}
.res b{display:block;font-weight:500}
.res small{color:var(--ink2);font-size:13px}
/* lists */
.list{padding:4px 16px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border:0;border-top:1px solid var(--ln);background:none;width:100%;text-align:start}
.row:first-child{border-top:0}
.ri{font-size:26px;width:34px;text-align:center}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:500}
.rt small{color:var(--ink2);font-size:13px}
.city{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--ln);cursor:pointer}
.city:first-child{border-top:0}
.city .nm{flex:1;min-width:0}
.city .nm b{display:block;font-weight:500}
.city small{color:var(--ink2);font-size:12.5px}
.city .ci{font-size:28px}
.city .t{font-size:34px;font-weight:300;min-width:62px;text-align:end}
.city .x{width:36px;height:36px;border-radius:50%;border:0;background:rgba(226,60,60,.6)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid var(--ln);font-size:15px;appearance:none;-webkit-appearance:none}
option{color:#111}
.cmp{margin-top:14px}
.cmp .r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--ln);text-align:center;font-size:14.5px;align-items:center}
.cmp .r>:first-child{text-align:start;color:var(--ink2);font-size:13px}
.cmp .h{font-weight:600;border-top:0}
.cmp .sent{margin-top:10px;font-weight:500;text-align:center}
/* settings */
.set{padding:14px 0;border-top:1px solid var(--ln)}
.set:first-of-type{border-top:0;padding-top:0}
.set>label,.set>b{display:block;font-size:14px;margin-bottom:8px;font-weight:500}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 10px;border:0;border-radius:10px;background:none;color:var(--ink2);text-shadow:none}
.seg button.on{background:#fff;color:#12263f;font-weight:600}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{width:52px;height:31px;border-radius:31px;background:rgba(255,255,255,.28);position:relative;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw.on{background:#43c46b}
.sw.on::after{inset-inline-start:24px}
.steps{padding-inline-start:20px;font-size:14px;color:var(--ink2)}
.steps li{margin:6px 0}
.about p{font-size:14.5px;color:var(--ink2);margin:8px 0}
.about h3{margin-top:14px}
/* prayer */
.pnext{text-align:center;padding:6px 0 4px}
.pnext small{color:var(--ink2);font-size:14px}
.pnext h3{font-size:28px;font-weight:600;margin:2px 0}
.pcount{font-size:56px;font-weight:200;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.1}
.prow{display:flex;justify-content:space-between;padding:13px 10px;border-radius:14px;font-size:17px}
.prow+.prow{margin-top:2px}
.prow.nx{background:rgba(255,255,255,.18);font-weight:600}
.prow.ps{opacity:.55}
.prow.sun{font-size:15px;color:var(--ink2)}
.qsvg{width:100%;max-width:270px;display:block;margin:0 auto}
.qinfo{text-align:center;margin-top:8px;font-size:15px}
.qinfo small{display:block;color:var(--ink2);font-size:13px}
.qok{color:#7dff9f;font-weight:600}
/* map */
#mapbox{height:calc(100dvh - 300px);min-height:330px;border-radius:22px;overflow:hidden;border:1px solid var(--ln);background:#0b1220}
.leaflet-container{background:#0b1220;font-family:var(--f)}
.mk i{display:block;width:18px;height:18px;border-radius:50%;background:#ffd76a;border:3px solid #fff;box-shadow:0 0 0 6px rgba(255,215,106,.35)}
.mapctl{display:flex;align-items:center;gap:12px;padding:12px 14px}
.mapctl input{flex:1;min-width:0;accent-color:#fff}
#mapinfo{font-size:13px;color:var(--ink2);min-width:84px;text-align:end}
.legend{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);margin-top:10px;padding:0 4px}
.lgb{flex:1;height:8px;border-radius:8px;background:linear-gradient(90deg,#a8defa,#3c8de0,#2f4bc4,#ffd23f,#ff5a36)}
/* moon, sea, farm */
.moonw{display:grid;place-items:center;padding:8px 0}
.moonw svg{width:170px;height:170px;filter:drop-shadow(0 0 30px rgba(255,248,210,.35))}
.moonw h3{font-size:26px;font-weight:600;margin-top:8px}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--ln);font-size:15px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--ink2)}
.week{display:flex;justify-content:space-between;text-align:center;font-size:12px;color:var(--ink2)}
.week em{display:block;font-style:normal;font-size:26px}
.bars{display:flex;align-items:flex-end;gap:3px;height:84px;direction:ltr}
.bars i{flex:1;background:linear-gradient(#a8e6ff,#3d8fd6);border-radius:3px 3px 0 0;min-height:3px}
.bl{display:flex;justify-content:space-between;direction:ltr;font-size:11.5px;color:var(--ink3);margin-top:4px}
.verdict{font-size:19px;font-weight:600;margin-bottom:6px}
.ftab .r{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:4px;padding:9px 0;border-top:1px solid var(--ln);font-size:14px;text-align:center}
.ftab .r>:first-child{text-align:start}
.ftab .h{color:var(--ink2);font-size:12.5px;border-top:0}
.toast{position:fixed;inset-inline:16px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);z-index:60;margin:0 auto;max-width:420px;background:rgba(8,16,34,.92);padding:12px 16px;border-radius:14px;text-align:center;font-size:14px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;text-shadow:none}
.toast.show{opacity:1;transform:none}
html[dir=rtl] .lgb{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
<section class="pg" id="p-home"></section>
<section class="pg" id="p-cities" hidden></section>
<section class="pg" id="p-map" hidden>
 <h2 class="ph" id="mapT"></h2><p class="sub" id="mapS"></p>
 <div id="mapbox"></div>
 <div class="card mapctl"><button class="btn sm" id="rplay" data-act="rplay"></button><input type="range" id="rslide" min="0" max="0" value="0"><div id="mapinfo"></div></div>
 <div class="legend"><span id="lgL"></span><i class="lgb"></i><span id="lgH"></span></div>
</section>
<section class="pg" id="p-prayer" hidden></section>
<section class="pg" id="p-more" hidden></section>
<section class="pg" id="p-sea" hidden></section>
<section class="pg" id="p-moon" hidden></section>
<section class="pg" id="p-farm" hidden></section>
<section class="pg" id="p-settings" hidden></section>
<section class="pg" id="p-about" hidden></section>
</main>
<nav class="nav" id="nav"></nav>
<div class="sheet" id="sheet" hidden>
 <div class="sbar"><input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="qc" data-act="closeSheet"></button></div>
 <div id="sres"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ========== أساسيات ========== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({lang:'ar',tu:'c',wu:'kmh',h12:false,method:3,fx:true,place:null,favs:[],recent:[]},LS.get('wx2',{}));
const save=()=>LS.set('wx2',S);
const T=(a,e)=>S.lang==='ar'?a:e;
const ltr=s=>'\u200E'+s+'\u200E';
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const pid=p=>(+p.lat).toFixed(2)+','+(+p.lon).toFixed(2);
const pname=p=>p.na&&p.ne?(S.lang==='ar'?p.na:p.ne):p.name;
const num=(n,d=0)=>n==null||isNaN(n)?'–':ltr(Number(n).toLocaleString('en',{minimumFractionDigits:d,maximumFractionDigits:d}));
const tmp=c=>c==null||isNaN(c)?'–':ltr(Math.round(S.tu==='f'?c*9/5+32:c)+'°');
const spdV=k=>Math.round(S.wu==='mph'?k*0.621371:k);
const spdU=()=>S.wu==='mph'?T('ميل/س','mph'):T('كم/س','km/h');
const spd=k=>k==null?'–':ltr(spdV(k))+' '+spdU();
const U=(v,u)=>`${v}<small class="u">${u==='%'?'':' '}${u}</small>`;
const toMin=s=>{const a=s.slice(0,5).split(':');return +a[0]*60+ +a[1]};
const pad=n=>String(n).padStart(2,'0');
const fmtT=s=>{let a=s.slice(0,5).split(':'),h=+a[0];const m=a[1];if(!S.h12)return ltr(pad(h)+':'+m);const ap=h>=12?T('م','PM'):T('ص','AM');h=h%12||12;return ltr(h+':'+m)+' '+ap};
const fmtH=s=>{const h=+s.slice(11,13);if(!S.h12)return ltr(pad(h)+':00');const ap=h>=12?T('م','PM'):T('ص','AM');return ltr(String(h%12||12))+' '+ap};
const LOC=()=>S.lang==='ar'?'ar-u-nu-latn':'en-US';

 if(k==='rain'||k==='storm'){c.strokeStyle='rgba(205,225,255,.5)';c.lineWidth=1.2;c.beginPath();for(const p of FX.p){c.moveTo(p.x,p.y);c.lineTo(p.x-p.l*.25,p.y+p.l);p.y+=p.v;p.x-=p.v*.25;if(p.y>h){p.y=-20;p.x=rnd(0,w+60)}}c.stroke()}

 if(k==='dust'){c.fillStyle='rgba(210,170,100,.12)';c.fillRect(0,0,w,h);c.fillStyle='rgba(245,220,165,.55)';c.beginPath();for(const p of FX.p){p.x-=p.v;p.y+=Math.sin(t/40+p.ph)*.5;if(p.x<-5){p.x=w+5;p.y=rnd(0,h)}c.moveTo(p.x+p.r,p.y);c.arc(p.x,p.y,p.r,0,6.283)}c.fill()}

function skyKey(d){

 const nm=toMin(c.time.slice(11,16)),sr=toMin(d.daily.sunrise[0].slice(11,16)),ss=toMin(d.daily.sunset[0].slice(11,16));
 let b;
 if((k==='clear'||k==='part')&&(Math.abs(nm-sr)<=40||Math.abs(nm-ss)<=40))b='gold';
 else if(k==='clear')b=day?'clear':'night';
 else if(k==='part')b=day?'part':'pnight';
 else if(k==='cloud')b=day?'cloud':'cnight';
 else b=k;
 if(AQ&&AQ.dust>=150&&(b==='clear'||b==='part'||b==='cloud'||b==='gold'))return 'dust';
 return b;
}

const RAD=Math.PI/180,DAYMS=864e5,OBL=RAD*23.4397,SYN=29.530588853,REF=Date.UTC(2000,0,6,18,14);

}
function moonTimes(t0,lat,lng){

 for(let i=1;i<=24;i+=2){
  const h1=moonAlt(new Date(t0.valueOf()+i*36e5),lat,lng)-hc,h2=moonAlt(new Date(t0.valueOf()+(i+1)*36e5),lat,lng)-hc;
  const a=(h0+h2)/2-h1,b=(h2-h0)/2,xe=-b/(2*a),ye=(a*xe+b)*xe+h1,d=b*b-4*a*h1;let roots=0,x1=0,x2=0;
  if(d>=0){const dx=Math.sqrt(d)/(Math.abs(a)*2);x1=xe-dx;x2=xe+dx;if(Math.abs(x1)<=1)roots++;if(Math.abs(x2)<=1)roots++;if(x1<-1)x1=x2}
  if(roots===1){if(h0<0)rise=i+x1;else set=i+x1}else if(roots===2){rise=i+(ye<0?x2:x1);set=i+(ye<0?x1:x2)}

 $('#p-about').innerHTML=`<div class="sh"><button class="ib" data-go="more" aria-label="${T('رجوع','Back')}">${ic('back','fl')}</button><h2>${T('عن التطبيق','About')}</h2></div>
<section class="card about"><h3>${T('ما هو؟','What is it?')}</h3><p>${T('تطبيق طقس يعرض الحرارة والتوقعات وجودة الهواء ورادار المطر وأوقات الصلاة والبحر والقمر وطقس الزراعة لأي مدينة في العالم.','A weather app with temperature, forecasts, air quality, rain radar, prayer times, sea, moon and farm weather for any city in the world.')}</p>
<h3>${T('مصادر البيانات','Data sources')}</h3><p>${T('الطقس وجودة الهواء والبحر والبحث عن المدن:','Weather, air quality, sea and city search:')}</p><p><a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>
<p>${T('أوقات الصلاة:','Prayer times:')}</p><p><a href="https://aladhan.com/" target="_blank" rel="noopener">AlAdhan.com</a></p>
<p>${T('رادار المطر:','Rain radar:')}</p><p><a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer.com</a></p>
<p>${T('الخرائط:','Maps:')}</p><p><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, <a href="https://carto.com/" target="_blank" rel="noopener">CARTO</a>, <a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a></p>
<h3>${T('الخصوصية','Privacy')}</h3><p>${T('لا يوجد حساب ولا تسجيل. تُحفظ مدنك وإعداداتك على جهازك فقط. لا يُستخدم موقعك إلا عند الضغط على زر الموقع، ويُرسل الموقع إلى مزودي البيانات أعلاه فقط لجلب الطقس والخرائط.','There are no accounts or sign-ups. Your cities and settings stay on your device. Your location is used only when you tap the location button, and it is sent only to the data providers above to fetch weather and maps.')}</p>
<h3>${T('تنبيه','Disclaimer')}</h3><p>${T('التوقعات تقريبية وقد تختلف عن الواقع. لا تعتمد عليها وحدها في قرارات السلامة، وتابع تحذيرات الجهات الرسمية. أوقات الصلاة محسوبة وقد تختلف دقائق عن التقويم المحلي.','Forecasts are approximate and can differ from reality. Do not rely on them alone for safety decisions, and follow official warnings. Prayer times are calculated and may differ by a few minutes from your local calendar.')}</p></section>`;
}

/* ========== التنقل والتشغيل ========== */
const SUB={sea:'more',moon:'more',farm:'more',settings:'more',about:'more'};
const NAVI=[['home','الرئيسية','Home','home'],['cities','المدن','Cities','star'],['map','الخريطة','Map','map'],['prayer','الصلاة','Prayer','moon'],['more','المزيد','More','more']];
function renderNav(){$('#nav').innerHTML=NAVI.map(n=>`<button data-go="${n[0]}" class="${(SUB[cur]||cur)===n[0]?'on':''}" aria-label="${n[S.lang==='ar'?1:2]}">${ic(n[3])}<span>${n[S.lang==='ar'?1:2]}</span></button>`).join('')}
const R={home:renderHome,cities:renderCities,map:renderMapChrome,prayer:renderPrayer,more:renderMore,sea:renderSea,moon:renderMoon,farm:renderFarm,settings:renderSettings,about:renderAbout};
const ENTER={cities:loadFavs,map:initMap,prayer:loadPrayer,sea:enterSea,farm:enterFarm};
function show(p){
 stopRadar();clearInterval(PT);PT=0;cur=p;
 $$('.pg').forEach(e=>{e.hidden=e.id!=='p-'+p});renderNav();window.scrollTo(0,0);
 if(ENTER[p])ENTER[p]();else R[p]();
}
function route(){let p=(location.hash||'#home').slice(1);if(!R[p])p='home';show(p)}
function render(){if(cur==='prayer')renderPrayer();else if(cur==='sea')renderSea();else if(cur==='farm')renderFarm();else R[cur]();renderNav()}
function applyLang(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.title=T('الطقس','Weather');const m=$('meta[name=apple-mobile-web-app-title]');if(m)m.setAttribute('content',T('الطقس','Weather'))}
function setOpt(k,v){
 if(k==='h12')v=v==='true';else if(k==='fx')v=!S.fx;
 S[k]=v;save();
 if(k==='lang')applyLang();
 if(k==='fx')fxRestart();
 if(k==='method'){PR=null;PRK=''}
 render();
}
function act(a){
 if(a==='search')openSheet('open');else if(a==='addcity')openSheet('fav');else if(a==='closeSheet')closeSheet();
 else if(a==='locate')locate();else if(a==='fav')toggleFav();else if(a==='refresh')loadPlace(S.place,false);
 else if(a==='share')shareImage();else if(a==='edit'){EDIT=!EDIT;renderCities()}else if(a==='compare')doCompare();
 else if(a==='rplay')playRadar();else if(a==='compass')startCompass();else if(a==='reloadPrayer')loadPrayer();
 else if(a==='install'&&DP){DP.prompt();DP=null;renderSettings()}
 else if(a==='clear'){if(confirm(T('سيتم حذف المدن المفضلة والإعدادات المحفوظة. هل تريد المتابعة؟','Saved cities and settings will be deleted. Continue?'))){try{localStorage.clear()}catch(e){}location.hash='';location.reload()}}
}
document.addEventListener('click',e=>{
 const t=e.target;let b;
 if((b=t.closest('[data-fd]'))){const i=+b.dataset.fd;S.favs.splice(i,1);save();FAVD=null;loadFavs();return}
 if((b=t.closest('[data-fo]'))){loadPlace(cleanP(S.favs[+b.dataset.fo]),true);return}
 if((b=t.closest('[data-go]'))){location.hash='#'+b.dataset.go;return}
 if((b=t.closest('[data-set]'))){setOpt(b.dataset.set,b.dataset.v);return}
 if((b=t.closest('[data-gc]'))){const a=b.dataset.gc.split('-').map(Number);pick(cityObj(a[0],a[1]));return}
 if((b=t.closest('[data-rc]'))){pick(S.recent[+b.dataset.rc]);return}
 if((b=t.closest('[data-sr]'))){pick(SRES[+b.dataset.sr]);return}
 if((b=t.closest('[data-act]')))act(b.dataset.act);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.city[role=button]')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='mth'){setOpt('method',+t.value)}
 else if(t.id==='cmpA')CMP.a=+t.value;else if(t.id==='cmpB')CMP.b=+t.value;
});
$('#q').addEventListener('input',e=>{clearTimeout(STM);STM=setTimeout(()=>searchGeo(e.target.value),320)});
$('#rslide').addEventListener('input',e=>{if(!RFR.length||!MAP)return;stopRadar();renderMapChrome();showFrame(+e.target.value)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(cur==='settings')renderSettings()});
addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&W&&!LOADING&&Date.now()-W._ts>15*60e3)loadPlace(S.place,false,true)});

applyLang();fxInit();
if(!S.place||S.place.lat==null)S.place=cityObj(0,0);
renderNav();route();loadPlace(S.place,false);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});

</script>
</body>
</html>
